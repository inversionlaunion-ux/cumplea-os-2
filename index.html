<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="estilos">
:root{
  --bg:#FFF1F4; --blob-a:#FFD3E0; --blob-b:#CFF5E8; --blob-c:#E4DAFF;
  --ink:#3B2A55; --soft:#7A6A93;
  --paper:#FFFFFF; --paper-ink:#3B2A55;
  --coral:#F0507A; --lila:#8B6CF0; --menta:#1FA884; --cielo:#2E9BE0; --durazno:#F27A4B; --sol:#FFC94D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211A3A; --blob-a:#4C2A5C; --blob-b:#1D4A49; --blob-c:#352F72;
    --ink:#FFF3F7; --soft:#C9BDE6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211A3A; --blob-a:#4C2A5C; --blob-b:#1D4A49; --blob-c:#352F72;
  --ink:#FFF3F7; --soft:#C9BDE6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  font-size:1.1rem; line-height:1.6; min-height:100vh; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
body.locked{overflow:hidden}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--lila); outline-offset:4px; border-radius:10px}
svg{display:block}

/* ---------- Fondo con manchas de color que flotan ---------- */
.fondo{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
.fondo span{position:absolute; width:70vmax; height:70vmax; border-radius:50%; opacity:.9; animation:deriva 22s ease-in-out infinite alternate}
.fondo span:nth-child(1){background:radial-gradient(circle, var(--blob-a), transparent 62%); top:-30vmax; left:-25vmax}
.fondo span:nth-child(2){background:radial-gradient(circle, var(--blob-b), transparent 62%); bottom:-35vmax; right:-30vmax; animation-duration:26s}
.fondo span:nth-child(3){background:radial-gradient(circle, var(--blob-c), transparent 62%); top:30%; left:40%; width:55vmax; height:55vmax; animation-duration:30s}
@keyframes deriva{to{transform:translate(8vmax,6vmax) scale(1.12)}}

/* ---------- Sobre de entrada ---------- */
#sobre{
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.2rem;
  background:var(--bg); overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 1rem) 1.5rem calc(env(safe-area-inset-bottom,0px) + 1rem);
  transition:opacity .7s ease 2s, visibility 0s linear 2.7s;
}
#sobre.abierto{opacity:0; visibility:hidden}
#sobre .flotan{position:absolute; inset:0; pointer-events:none}
#sobre .flotan svg{position:absolute; bottom:-40px; animation:sube linear infinite; opacity:.8}
@keyframes sube{to{transform:translateY(-115vh) rotate(25deg)}}
.saludo{margin:0; font-size:1.25rem; color:var(--soft); text-align:center}
.envelope{position:relative; width:min(82vw,340px); aspect-ratio:1.42; animation:flotaSobre 3s ease-in-out infinite}
@keyframes flotaSobre{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
#sobre.abierto .envelope{animation:none}
.env-fondo{position:absolute; inset:0; background:#FF9DB5; border-radius:12px}
.cartita{
  position:absolute; left:8%; right:8%; top:8%; bottom:6%; z-index:1;
  background:#fff; border-radius:8px; display:grid; place-items:center;
  font-family:"Caveat",cursive; font-size:2rem; color:var(--coral);
  transition:transform .8s cubic-bezier(.3,1.4,.5,1) .55s;
  box-shadow:0 6px 18px rgba(120,30,60,.15);
}
#sobre.abierto .cartita{transform:translateY(-62%) rotate(-3deg)}
.bolsillo{
  position:absolute; inset:0; z-index:2; border-radius:12px;
  background:linear-gradient(160deg,#FFB8C9,#FF8FAB);
  clip-path:polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
}
.solapa{
  position:absolute; inset:0; z-index:3; background:#FF7E9E; border-radius:12px;
  clip-path:polygon(0 0,100% 0,50% 58%); transform-origin:top center;
  transition:transform .6s cubic-bezier(.6,.05,.3,1), z-index 0s linear .3s;
}
#sobre.abierto .solapa{transform:rotateX(180deg); z-index:0}
.sello{
  position:absolute; z-index:4; left:50%; top:56%; translate:-50% -50%;
  width:74px; height:74px; border-radius:50%; border:none; cursor:pointer; padding:0;
  background:radial-gradient(circle at 35% 30%, #FF8FA8, var(--coral) 55%, #C93060);
  box-shadow:0 8px 18px -6px rgba(160,20,60,.6), inset 0 -4px 8px rgba(0,0,0,.18);
  display:grid; place-items:center; animation:latido 1.6s ease-in-out infinite;
  transition:transform .45s cubic-bezier(.5,-0.5,.7,1.4), opacity .4s ease;
}
.sello svg{width:34px; height:34px}
@keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
#sobre.abierto .sello{transform:scale(0) rotate(90deg); opacity:0; animation:none}
.pista{margin:0; color:var(--soft); font-size:1rem; display:flex; align-items:center; gap:.4rem}
.pista svg{width:20px; height:20px; animation:toca 1.4s ease-in-out infinite}
@keyframes toca{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- Portada ---------- */
main{max-width:680px; margin:0 auto; padding:0 1.25rem 4rem; position:relative}
.hero{
  position:relative; min-height:96vh; min-height:96svh;
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
}
.hero .linea{
  margin:0; font-family:"Caveat",cursive; font-size:clamp(2rem,8vw,2.8rem); color:var(--soft);
}
.hero h1{
  margin:.1em 0 0; font-weight:700; line-height:1; letter-spacing:-.01em;
  font-size:clamp(2.6rem,15vw,7.2rem); display:flex; flex-wrap:wrap; justify-content:center; column-gap:.25em;
  max-width:100%;
}
.hero h1 .palabra{display:inline-block; white-space:nowrap}
.hero .linea, .hero h1, .hero .fecha, .hero .baja{position:relative; z-index:1}
@media (max-width:440px){
  .globo{scale:.68; transform-origin:top center}
}
.hero h1 .l{display:inline-block; text-shadow:0 4px 0 rgba(59,42,85,.08)}
.hero h1 .l:nth-child(5n+1){color:var(--coral)}
.hero h1 .l:nth-child(5n+2){color:var(--lila)}
.hero h1 .l:nth-child(5n+3){color:var(--menta)}
.hero h1 .l:nth-child(5n+4){color:var(--durazno)}
.hero h1 .l:nth-child(5n+5){color:var(--cielo)}
.hero .fecha{
  margin:1.6rem 0 0; display:inline-flex; align-items:center; gap:.5rem;
  background:var(--paper); color:var(--paper-ink); padding:.45rem 1.1rem; border-radius:999px;
  box-shadow:0 10px 24px -16px rgba(59,42,85,.6); font-weight:500;
}
.hero .fecha svg{width:20px; height:20px}
.baja{margin-top:3rem; color:var(--soft); font-size:.95rem; display:flex; flex-direction:column; align-items:center; gap:.3rem}
.baja svg{width:26px; height:26px; animation:toca 1.6s ease-in-out infinite}

.globo{position:absolute; pointer-events:none}
.globo .mueve{animation:bambolea 4.5s ease-in-out infinite alternate}
.globo svg{width:100%; height:auto}
@keyframes bambolea{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-18px) rotate(5deg)}}
.chispa{position:absolute; pointer-events:none; animation:brilla 2.4s ease-in-out infinite}
@keyframes brilla{0%,100%{transform:scale(.4) rotate(0); opacity:.3}50%{transform:scale(1) rotate(90deg); opacity:1}}

/* animaciones de entrada (cuando se abre el sobre) */
body:not(.locked) .hero .linea{animation:pop .7s cubic-bezier(.3,1.5,.5,1) .1s both}
body:not(.locked) .hero h1 .l{animation:salta .8s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(.3s + var(--i) * .07s)}
body:not(.locked) .hero .fecha{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:calc(.5s + var(--n) * .07s)}
body:not(.locked) .hero .baja{animation:pop .7s ease both; animation-delay:calc(.8s + var(--n) * .07s)}
body:not(.locked) .globo{animation:despega 2.2s cubic-bezier(.2,.8,.3,1) both; animation-delay:var(--d)}
@keyframes salta{0%{opacity:0; transform:translateY(60px) scale(.3) rotate(-20deg)}60%{opacity:1; transform:translateY(-14px) scale(1.12) rotate(4deg)}100%{opacity:1; transform:none}}
@keyframes pop{0%{opacity:0; transform:scale(.6)}100%{opacity:1; transform:none}}
@keyframes despega{from{opacity:0; transform:translateY(80vh)}to{opacity:1; transform:none}}
body.locked .hero > *, body.locked .globo{opacity:0}

/* ---------- Secciones ---------- */
section{margin:4.5rem 0}
.titulo-seccion{text-align:center; margin-bottom:1.8rem}
.titulo-seccion .icono-titulo{width:54px; height:54px; margin:0 auto .5rem}
h2{margin:0; font-weight:700; font-size:clamp(2rem,8vw,2.7rem); line-height:1.1}
.garabato{width:170px; height:18px; margin:.35rem auto 0; overflow:visible}
.garabato path{fill:none; stroke:var(--coral); stroke-width:4; stroke-linecap:round; stroke-dasharray:260; stroke-dashoffset:260; transition:stroke-dashoffset 1.2s ease .3s}
.visto .garabato path{stroke-dashoffset:0}
.revelar{opacity:0; transform:translateY(40px) scale(.94) rotate(-1.5deg); transition:opacity .8s ease, transform .9s cubic-bezier(.3,1.4,.5,1)}
.revelar.visto{opacity:1; transform:none}
.ayuda{text-align:center; color:var(--soft); margin:0 0 1.8rem; font-size:1rem}

/* ---------- Carta ---------- */
.carta{
  position:relative; background:var(--paper); color:var(--paper-ink);
  padding:2.6rem clamp(1.4rem,6vw,2.6rem) 2.2rem; border-radius:18px;
  box-shadow:0 30px 60px -36px rgba(59,42,85,.7);
  font-family:"Caveat",cursive; font-size:clamp(1.45rem,5.4vw,1.75rem); line-height:1.45;
  background-image:radial-gradient(circle at 1.4rem 1.4rem, #FFE3EA 0 1.5px, transparent 2px);
  background-size:1.4rem 1.4rem;
}
.carta p{margin:0 0 1rem; position:relative}
.carta .firma{text-align:right; color:var(--coral); font-weight:700; margin:1.4rem 0 0}
.cinta{position:absolute; width:110px; height:30px; top:-13px; opacity:.85; border-radius:3px;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 6px, transparent 6px 12px), var(--c,#FFC94D)}
.cinta.izq{left:18px; rotate:-8deg} .cinta.der{right:18px; rotate:7deg}
.carta .dibujito{position:absolute; width:56px; height:56px; right:-10px; bottom:-18px; rotate:12deg}

/* ---------- Momentos ---------- */
.momentos{display:grid; grid-template-columns:repeat(2,1fr); gap:1.1rem}
@media (max-width:380px){.momentos{gap:.8rem}}
.momento{
  position:relative; border:none; cursor:pointer; text-align:center; overflow:hidden;
  background:var(--bgc); color:var(--paper-ink); border-radius:24px;
  padding:1.3rem .8rem 1.1rem; min-height:205px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.45rem;
  box-shadow:0 18px 30px -22px rgba(59,42,85,.7), inset 0 -6px 0 rgba(0,0,0,.05);
  transition:opacity .8s ease, transform .5s cubic-bezier(.3,1.6,.5,1);
}
.momento:nth-child(odd){rotate:-1.5deg} .momento:nth-child(even){rotate:1.5deg}
.momento:active{transform:scale(.95)}
@media (hover:hover){.momento:hover{transform:translateY(-6px) rotate(2deg)}}
.momento::before{ /* lunares de fondo */
  content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:radial-gradient(circle, #fff 0 2px, transparent 2.5px); background-size:18px 18px;
}
.momento .zona{position:relative; width:78px; height:78px; display:grid; place-items:center}
.momento .candado, .momento .icono{position:absolute; inset:0; margin:auto}
.momento .candado{width:58px; height:70px; overflow:visible; transition:transform .5s cubic-bezier(.5,-0.4,.6,1), opacity .4s ease}
.momento .icono{
  width:70px; height:70px; border-radius:50%; background:#fff; display:grid; place-items:center;
  color:var(--fc); transform:scale(0) rotate(-90deg); transition:transform .6s cubic-bezier(.3,1.7,.5,1);
  box-shadow:0 8px 18px -10px rgba(59,42,85,.6);
}
.momento .icono svg{width:36px; height:36px}
.candado .arco{transform-origin:62px 40px; transition:transform .4s cubic-bezier(.3,1.8,.5,1)}
.momento.abierto .candado{transform:translateY(-90px) rotate(25deg) scale(.6); opacity:0}
.momento.abierto .candado .arco{transform:translateY(-10px) rotate(30deg)}
.momento.abierto .icono{transform:none; transition-delay:.25s}
.momento.temblor .candado{animation:temblor .5s ease}
@keyframes temblor{0%,100%{rotate:0deg}20%{rotate:-14deg}40%{rotate:12deg}60%{rotate:-8deg}80%{rotate:5deg}}
.momento .titulo{position:relative; font-family:"Caveat",cursive; font-weight:700; font-size:clamp(1.35rem,5.2vw,1.7rem); line-height:1.05}
.momento .cuando{position:relative; font-size:.82rem; opacity:.7}
.momento .estado{
  position:relative; font-size:.75rem; font-weight:600; color:var(--fc);
  background:#fff; border-radius:999px; padding:.1rem .6rem; display:inline-flex; align-items:center; gap:.25rem;
}
.momento .estado svg{width:12px; height:12px}

/* cortina de transición entre páginas */
#cortina{
  position:fixed; inset:0; z-index:70; pointer-events:none; background:var(--cc,#FF9DB5);
  clip-path:circle(0px at var(--x,50%) var(--y,50%));
  transition:clip-path .65s cubic-bezier(.7,0,.3,1), opacity .45s ease;
}
#cortina.cubre{clip-path:circle(150vmax at var(--x,50%) var(--y,50%)); pointer-events:auto}
#cortina.sale{opacity:0}
#cortina svg{position:absolute; left:50%; top:50%; width:70px; height:70px; translate:-50% -50%; color:#fff; opacity:0; transition:opacity .3s ease .3s}
#cortina.cubre svg{opacity:1; animation:latido 1s ease-in-out infinite}

/* ---------- Página de cada momento ---------- */
#pagina-momento{max-width:640px; margin:0 auto; padding:1.25rem 1.25rem 4rem}
.volver{
  display:inline-flex; align-items:center; gap:.45rem; border:none; cursor:pointer;
  background:var(--paper); color:var(--paper-ink); border-radius:999px; font-weight:500;
  padding:.6rem 1.15rem .6rem .9rem; font-size:1rem; box-shadow:0 10px 24px -14px rgba(59,42,85,.6);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1);
}
.volver:active{transform:scale(.94)}
.volver svg{width:20px; height:20px}
.cabecera-momento{text-align:center; margin:2.2rem 0 2.4rem; position:relative}
.insignia{
  width:96px; height:96px; margin:0 auto; border-radius:50%; background:var(--bgc); color:var(--fc);
  display:grid; place-items:center; box-shadow:0 14px 30px -16px rgba(59,42,85,.7);
}
.insignia svg{width:48px; height:48px}
.cabecera-momento h1{font-family:"Caveat",cursive; font-weight:700; margin:.7rem 0 0; font-size:clamp(2.8rem,12vw,4rem); line-height:1}
.cabecera-momento .cuando{
  margin:.8rem 0 0; display:inline-block; padding:.25rem .9rem; border-radius:999px;
  background:var(--bgc); color:var(--paper-ink); font-size:.95rem;
}
.entra .insignia{animation:pop .7s cubic-bezier(.3,1.7,.5,1) .15s both}
.entra .cabecera-momento h1{animation:salta .8s cubic-bezier(.3,1.5,.5,1) .3s both}
.entra .cabecera-momento .cuando{animation:pop .6s ease .5s both}
.recuerdos{display:flex; flex-direction:column; gap:2.2rem}
.recuerdo{
  position:relative; margin:0; background:#fff; padding:.75rem .75rem 2.4rem; border-radius:6px;
  box-shadow:0 26px 44px -28px rgba(59,42,85,.75);
}
.recuerdo:nth-child(odd){rotate:-1.6deg} .recuerdo:nth-child(even){rotate:1.4deg}
.entra .recuerdo{animation:cae .9s cubic-bezier(.3,1.4,.5,1) both; animation-delay:calc(.55s + var(--k) * .15s)}
@keyframes cae{0%{opacity:0; transform:translateY(-40px) scale(1.15) rotate(8deg)}100%{opacity:1; transform:none}}
.recuerdo .cinta{top:-12px; left:50%; translate:-50% 0; rotate:-3deg}
.recuerdo img, .recuerdo video{width:100%; height:auto; display:block; border-radius:3px; background:#F3EAF5}
.recuerdo .vacia{
  aspect-ratio:4/5; display:grid; place-items:center; align-content:center; gap:.6rem; text-align:center; padding:1rem;
  background:var(--bgc); color:var(--fc); border-radius:3px;
  font-family:"Caveat",cursive; font-size:1.6rem; line-height:1.1;
}
.recuerdo .vacia svg{width:48px; height:48px}
.mensaje-momento{
  position:relative; margin-top:3.2rem; background:var(--paper); color:var(--paper-ink);
  padding:2.4rem clamp(1.4rem,6vw,2.4rem) 2rem; border-radius:18px; white-space:pre-line;
  font-family:"Caveat",cursive; font-size:clamp(1.5rem,5.6vw,1.8rem); line-height:1.4;
  box-shadow:0 30px 60px -36px rgba(59,42,85,.7);
}
.mensaje-momento .corazon-esquina{position:absolute; width:46px; height:46px; right:-8px; top:-18px; rotate:14deg; animation:latido 1.8s ease-in-out infinite}
.siguiente{display:flex; justify-content:center; margin-top:2.8rem}
.siguiente .volver{padding:.75rem 1.4rem; font-weight:600; text-align:left; background:var(--bgc)}

/* ---------- Pastel ---------- */
.final{text-align:center}
.instruccion{color:var(--soft); margin:0 auto; max-width:30ch}
.pastel{position:relative; width:240px; height:270px; margin:1.2rem auto 0}
.plato{position:absolute; bottom:22px; left:50%; translate:-50% 0; width:250px; height:18px; border-radius:50%; background:#fff; box-shadow:0 10px 20px -10px rgba(59,42,85,.5)}
.piso1{position:absolute; bottom:34px; left:50%; translate:-50% 0; width:210px; height:70px; border-radius:16px 16px 10px 10px;
  background:radial-gradient(circle, #fff 0 2px, transparent 2.5px) 0 0/16px 16px, #FF9DB5}
.piso2{position:absolute; bottom:100px; left:50%; translate:-50% 0; width:160px; height:56px; border-radius:14px 14px 8px 8px;
  background:radial-gradient(circle, var(--sol) 0 2.5px, transparent 3px) 4px 4px/18px 18px, #B9A6FF}
.glaseado{position:absolute; left:0; right:0; top:-2px; height:22px; border-radius:14px 14px 0 0; background:#FFF6FA}
.glaseado::after{content:""; position:absolute; left:0; right:0; top:14px; height:16px;
  background:radial-gradient(circle at 10px 0, #FFF6FA 9px, transparent 10px) 0 0/22px 16px repeat-x}
.chispitas{position:absolute; inset:0; pointer-events:none}
.vela{position:absolute; left:50%; bottom:152px; translate:-50% 0; width:18px; height:70px; border-radius:5px;
  background:repeating-linear-gradient(135deg,#fff 0 7px,#5FD3B3 7px 14px)}
.mecha{position:absolute; left:50%; top:-10px; translate:-50% 0; width:2px; height:11px; background:#4A3A4A; border-radius:2px}
.llama{position:absolute; left:50%; top:-64px; translate:-50% 0; width:64px; height:70px; border:none; background:none; padding:0; cursor:pointer}
.llama i{
  position:absolute; left:50%; bottom:6px; translate:-50% 0; width:22px; height:40px;
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 80%, #FFF6C9 0 25%, #FFC94D 50%, #FF7A59 92%);
  box-shadow:0 0 34px 12px rgba(255,190,80,.5);
  animation:titila 1.3s ease-in-out infinite alternate; transform-origin:50% 100%;
  transition:opacity .35s ease, transform .35s ease;
}
@keyframes titila{0%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.07,.94) rotate(2deg)}100%{transform:scale(.95,1.06) rotate(-1deg)}}
.apagada .llama i{opacity:0; transform:scale(.1); animation:none}
.humo{position:absolute; left:50%; top:-30px; width:10px; height:10px; border-radius:50%; background:rgba(190,180,200,.7); opacity:0; translate:-50% 0}
.humo:nth-of-type(2){left:40%}
.apagada .humo{animation:humo 2s ease-out forwards}
.apagada .humo:nth-of-type(2){animation-delay:.2s}
@keyframes humo{0%{opacity:.8; transform:translateY(0) scale(1)}100%{opacity:0; transform:translate(10px,-80px) scale(4)}}
.deseo{
  max-width:26ch; margin:1.8rem auto 0; font-family:"Caveat",cursive; font-weight:700;
  font-size:clamp(2rem,8vw,2.7rem); line-height:1.1; color:var(--coral);
  opacity:0; transform:scale(.6) rotate(-4deg); transition:opacity .8s ease .5s, transform .9s cubic-bezier(.3,1.7,.5,1) .5s;
}
.apagada ~ .deseo{opacity:1; transform:none}

/* corazoncitos al tocar */
.toque{position:fixed; z-index:80; width:16px; height:16px; pointer-events:none; margin:-8px 0 0 -8px; animation:vuela .9s ease-out forwards}
@keyframes vuela{0%{opacity:1; transform:translate(0,0) scale(.4)}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r))}}

canvas#confeti{position:fixed; inset:0; pointer-events:none; z-index:60}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition-duration:.01ms !important; transition-delay:0s !important}
  .revelar{opacity:1; transform:none}
  body.locked .hero > *, body.locked .globo{opacity:1}
}

[hidden]{display:none !important}
#btn-editar{
  position:fixed; z-index:85; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:inline-flex; align-items:center; gap:.45rem; border:none; cursor:pointer;
  background:var(--coral); color:#fff; font-weight:600; font-size:1rem;
  padding:.75rem 1.2rem; border-radius:999px; box-shadow:0 14px 30px -12px rgba(160,20,60,.7);

}
#btn-editar svg{width:20px; height:20px}
#editor{
  position:fixed; inset:0; z-index:90; overflow-y:auto; overscroll-behavior:contain;
  background:rgba(40,25,60,.45); -webkit-overflow-scrolling:touch;
}
.ed-hoja{
  max-width:640px; margin:0 auto; min-height:100%; background:#FFFBFD; color:#3B2A55;
  padding:calc(env(safe-area-inset-top,0px) + 1.4rem) 1.15rem calc(env(safe-area-inset-bottom,0px) + 7rem);
  font-size:1rem;
}
.ed-cab h2{font-size:1.8rem; margin:0}
.ed-cab p{margin:.3rem 0 0; color:#7A6A93}
.ed-grupo{margin-top:1.4rem; background:#fff; border-radius:20px; padding:1.1rem; box-shadow:0 10px 30px -22px rgba(59,42,85,.6)}
.ed-grupo > h3{margin:0 0 .8rem; font-size:1.2rem; display:flex; align-items:center; gap:.5rem}
.ed-grupo > h3 svg{width:22px; height:22px; color:var(--coral)}
.ed-campo{display:block; margin:0 0 .9rem}
.ed-campo:last-child{margin-bottom:0}
.ed-campo > span{display:block; font-weight:500; font-size:.92rem; margin-bottom:.3rem}
.ed-campo small{display:block; color:#8A7A99; font-weight:400; font-size:.82rem; margin-top:-.15rem; margin-bottom:.35rem}
.ed-campo input, .ed-campo textarea{
  width:100%; font:inherit; font-size:16px; color:#3B2A55; background:#FFF5F8;
  border:2px solid #F3DCE6; border-radius:12px; padding:.65rem .8rem; line-height:1.45;
}
.ed-campo textarea{resize:vertical; min-height:5rem}
.ed-campo input:focus, .ed-campo textarea:focus{outline:none; border-color:var(--coral); background:#fff}
.ed-momento{border:2px solid #F1E4EC; border-radius:18px; padding:.95rem; margin-bottom:1rem; background:#FFFDFE}
.ed-m-cab{display:flex; align-items:center; gap:.4rem; margin-bottom:.8rem}
.ed-m-cab .ed-num{flex:1; font-weight:600; display:flex; align-items:center; gap:.5rem}
.ed-m-cab .ed-num i{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--bgc); color:var(--fc); font-style:normal}
.ed-m-cab .ed-num i svg{width:18px; height:18px}
.ed-mini{
  width:36px; height:36px; border-radius:10px; border:none; cursor:pointer; background:#F6ECF2; color:#3B2A55;
  display:grid; place-items:center; flex:0 0 auto;
}
.ed-mini svg{width:18px; height:18px}
.ed-mini.peligro{background:#FFE3E9; color:#C9304F}
.ed-mini:disabled{opacity:.35; cursor:default}
.ed-opciones{display:flex; flex-wrap:wrap; gap:.45rem}
.ed-opcion{
  width:42px; height:42px; border-radius:12px; border:2px solid transparent; cursor:pointer;
  display:grid; place-items:center; background:#F6ECF2; color:#5A4A75;
}
.ed-opcion svg{width:22px; height:22px}
.ed-opcion[aria-pressed="true"]{border-color:#3B2A55; background:#fff}
.ed-color{border-radius:50%; width:38px; height:38px}
.ed-color[aria-pressed="true"]{box-shadow:0 0 0 3px #fff, 0 0 0 5px #3B2A55; border-color:transparent}
.ed-media{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem}
.ed-item{position:relative; aspect-ratio:1; min-width:0; border-radius:12px; overflow:hidden; background:#F3EAF5}
.ed-item img, .ed-item video{width:100%; height:100%; object-fit:cover; display:block}
.ed-item .ed-vacio{width:100%; height:100%; display:grid; place-items:center; text-align:center; font-size:.75rem; color:#8A7A99; padding:2rem .3rem .3rem; font-size:.72rem; border:2px dashed #E3D3E8; border-radius:12px}
.ed-item .ed-tipo{position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.55); color:#fff; border-radius:8px; padding:.1rem .35rem; font-size:.7rem; display:flex; align-items:center; gap:.2rem}
.ed-item .ed-tipo svg{width:12px; height:12px}
.ed-item .ed-acciones{position:absolute; top:5px; right:5px; left:5px; display:flex; justify-content:space-between}
.ed-item .ed-acciones button{width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:#3B2A55; cursor:pointer; display:grid; place-items:center; padding:0}
.ed-item .ed-acciones button svg{width:15px; height:15px}
.ed-item .ed-acciones .x{color:#C9304F}
.ed-subir{
  position:relative; min-width:0; aspect-ratio:1; border-radius:12px; border:2px dashed var(--coral); color:var(--coral); background:#FFF5F8;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.25rem; cursor:pointer;
  font-size:.8rem; font-weight:500; text-align:center; padding:.3rem;
}
.ed-subir svg{width:26px; height:26px}
.ed-subir input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}

.ed-estado-subida{font-size:.85rem; color:#7A6A93; margin:.5rem 0 0; min-height:1.2em}
.ed-agregar{
  width:100%; border:2px dashed #CDB8F5; background:#F7F2FF; color:#6B4FD8; border-radius:16px;

}
.ed-agregar svg{width:20px; height:20px}
.ed-barra{
  position:fixed; left:0; right:0; bottom:0; z-index:95; display:flex; justify-content:center; gap:.5rem;

  display:flex; align-items:center; gap:.4rem; padding:.4rem; border-radius:999px;

}

/* ---------- Transición tipo cortina ---------- */
const cortina = $("cortina");
function cubrir(el, color, luego){
  if (reduce()){ luego(); return; }
  const r = el.getBoundingClientRect();
  cortina.style.setProperty("--x", (r.left + r.width/2) + "px");
  cortina.style.setProperty("--y", (r.top + r.height/2) + "px");
  cortina.style.setProperty("--cc", color);
  cortina.classList.remove("sale");
  cortina.classList.add("cubre");
  setTimeout(() => {
    luego();
    requestAnimationFrame(() => {
      cortina.classList.add("sale");
      setTimeout(() => { cortina.style.transition = "none"; cortina.classList.remove("cubre","sale"); void cortina.offsetWidth; cortina.style.transition = ""; }, 460);
    });
  }, 700);
}
function irAMomento(i, el){

}

/* ---------- Confeti de corazones y estrellas ---------- */
const cv = $("confeti"), ctx = cv.getContext("2d");
let piezas = [], corriendo = false;
function ajustar(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", ajustar); ajustar();
const colConfeti = ["#F0507A","#FF9DB5","#8B6CF0","#B9A6FF","#1FA884","#9EE6CF","#FFC94D","#6EC6FF"];
const pathCorazon = new Path2D(CORAZON), pathChispa = new Path2D(CHISPA);
function explosion(x, y, n){
  if (reduce()) return;
  for (let k = 0; k < n; k++){
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    piezas.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 5, s: 8 + Math.random()*10,
      r: Math.random()*6, vr: (Math.random()-.5)*.25, c: colConfeti[k % colConfeti.length], f: k % 3, vida: 0 });
  }
  arrancar();
}
function lluvia(){
  if (reduce()) return;
  for (let k = 0; k < 160; k++){
    piezas.push({ x: Math.random()*innerWidth, y: -20 - Math.random()*innerHeight*.6, vx: (Math.random()-.5)*2, vy: 1 + Math.random()*3,
      s: 8 + Math.random()*10, r: Math.random()*6, vr: (Math.random()-.5)*.2, c: colConfeti[k % colConfeti.length], f: k % 3, vida: 0, cae: true });
  }
  arrancar();
}
function arrancar(){ if (!corriendo){ corriendo = true; requestAnimationFrame(paso); } }
function paso(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  piezas.forEach(p => {
    p.vy += p.cae ? .04 : .25; p.vx *= .985; p.x += p.vx + (p.cae ? Math.sin(p.vida*.05)*.6 : 0); p.y += p.vy; p.r += p.vr; p.vida++;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.f === 0){ ctx.scale(p.s/24, p.s/24); ctx.translate(-12,-12); ctx.fill(pathCorazon); }
    else if (p.f === 1){ ctx.scale(p.s/24, p.s/24); ctx.translate(-12,-12); ctx.fill(pathChispa); }
    else { ctx.beginPath(); ctx.ellipse(0, 0, p.s/2.4, p.s/4 * Math.abs(Math.cos(p.vida*.1)) + 1, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  });
  piezas = piezas.filter(p => p.y < innerHeight + 40);
  if (piezas.length) requestAnimationFrame(paso); else { corriendo = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

      <button class="ed-btn" id="ed-cancelar">${UI.x}Cancelar</button>

      <button class="ed-btn principal" id="ed-guardar">${UI.listo}Guardar</button>
    </div>`;
  document.body.appendChild(ed);

  const previa = document.createElement("div");
  previa.id = "barra-previa"; previa.hidden = true;
  previa.innerHTML = `<span>Vista previa</span><button class="ed-btn" id="pv-editar">${UI.lapiz}Editar</button><button class="ed-btn principal" id="pv-guardar">${UI.listo}Guardar</button>`;
  document.body.appendChild(previa);

  ed.querySelectorAll("[data-campo]").forEach(el => el.addEventListener("input", () => {
    const k = el.dataset.campo;
    borrador[k] = k === "carta" ? el.value.split(/\n\s*\n/).map(t => t.trim()).filter(Boolean) : el.value;
  }));
  $("ed-agregar").addEventListener("click", () => {
    const usados = borrador.momentos.map(m => m.color);
    const libre = Object.keys(COLORES).find(c => !usados.includes(c)) || "coral";
    borrador.momentos.push({ titulo: "Nuevo momento", cuando: "", icono: "corazon", color: libre, media: [], mensaje: "" });
    pintarEditorMomentos();
    const tarjetas = $("ed-momentos").children;
    const ultimaT = tarjetas[tarjetas.length - 1];
    ultimaT.scrollIntoView({ behavior: "smooth", block: "center" });
    ultimaT.querySelector("input").focus({ preventScroll: true });
  });
  $("ed-cancelar").addEventListener("click", cancelarEdicion);
  $("ed-previa").addEventListener("click", verPrevia);
  $("ed-guardar").addEventListener("click", guardar);
  $("pv-editar").addEventListener("click", volverAEditar);
  $("pv-guardar").addEventListener("click", guardar);
  addEventListener("keydown", e => { if (e.key === "Escape" && !$("editor").hidden) cancelarEdicion(); });
}

function abrirEditor(){
  original = JSON.parse(JSON.stringify(CONTENIDO));
  borrador = JSON.parse(JSON.stringify(CONTENIDO));
  llenarFormulario();
  mostrarEditor();
}
function mostrarEditor(){
  $("editor").hidden = false; $("barra-previa").hidden = true; $("btn-editar").hidden = true;
  document.body.classList.add("editando");
  $("editor").scrollTop = 0;
}
function cerrarEditor(){
  $("editor").hidden = true; $("barra-previa").hidden = true; $("btn-editar").hidden = false;
  document.body.classList.remove("editando");
}
function llenarFormulario(){
  $("editor").querySelectorAll("[data-campo]").forEach(el => {
    const k = el.dataset.campo;
    el.value = k === "carta" ? (borrador.carta || []).join("\n\n") : (borrador[k] || "");
  });
  pintarEditorMomentos();
}
function cancelarEdicion(){
  if (subiendo){ avisar("Espera a que terminen de subirse los archivos."); return; }
  CONTENIDO = original; borrador = null;
  renderTodo(); cerrarEditor();
}
function verPrevia(){
  CONTENIDO = JSON.parse(JSON.stringify(borrador));
  renderTodo();
  $("editor").hidden = true; $("barra-previa").hidden = false;
  document.body.classList.remove("editando");
}
function volverAEditar(){ mostrarEditor(); pintarEditorMomentos(); }

/* --- Lista de momentos dentro del editor --- */
let subiendo = 0;
function pintarEditorMomentos(){
  const cont = $("ed-momentos");
  cont.innerHTML = "";
  const total = borrador.momentos.length;
  borrador.momentos.forEach((m, i) => {
    const c = colorDe(m);
    const card = document.createElement("div");
    card.className = "ed-momento";
    card.style.setProperty("--bgc", c.bg); card.style.setProperty("--fc", c.f);
    card.innerHTML = `
      <div class="ed-m-cab">
        <span class="ed-num"><i>${iconoDe(m)}</i>Momento ${i + 1}</span>
        <button class="ed-mini" data-a="subir" aria-label="Subir este momento" ${i === 0 ? "disabled" : ""}>${UI.arriba}</button>
        <button class="ed-mini" data-a="bajar" aria-label="Bajar este momento" ${i === total - 1 ? "disabled" : ""}>${UI.abajo}</button>
        <button class="ed-mini peligro" data-a="borrar" aria-label="Borrar este momento">${UI.basura}</button>
      </div>
      <label class="ed-campo"><span>Título</span><input data-m="titulo" autocomplete="off"></label>
      <label class="ed-campo"><span>Fecha o lugar</span><input data-m="cuando" autocomplete="off"></label>
      <div class="ed-campo"><span>Icono</span><div class="ed-opciones" data-grupo="icono"></div></div>
      <div class="ed-campo"><span>Color</span><div class="ed-opciones" data-grupo="color"></div></div>
      <label class="ed-campo"><span>Mensaje de este momento</span><textarea data-m="mensaje" rows="4"></textarea></label>
      <div class="ed-campo"><span>Fotos y videos</span>
        <div class="ed-media"></div>
        <p class="ed-estado-subida" aria-live="polite"></p>
      </div>`;
    card.querySelector('[data-m="titulo"]').value = m.titulo || "";
    card.querySelector('[data-m="cuando"]').value = m.cuando || "";
    card.querySelector('[data-m="mensaje"]').value = m.mensaje || "";
    card.querySelectorAll("[data-m]").forEach(el => el.addEventListener("input", () => { m[el.dataset.m] = el.value; }));

    const gIcono = card.querySelector('[data-grupo="icono"]');
    ["corazon","estrella","avion","camara","musica","regalo","luna","flor"].forEach(k => {
      const b = document.createElement("button");
      b.className = "ed-opcion"; b.innerHTML = ICONOS[k];
      b.setAttribute("aria-label", "Icono " + k); b.setAttribute("aria-pressed", String(m.icono === k));
      b.addEventListener("click", () => { m.icono = k; pintarEditorMomentos(); });
      gIcono.appendChild(b);
    });
    const gColor = card.querySelector('[data-grupo="color"]');
    Object.entries(COLORES).forEach(([k, v]) => {
      const b = document.createElement("button");
      b.className = "ed-opcion ed-color"; b.style.background = `linear-gradient(135deg, ${v.bg} 50%, ${v.f} 50%)`;
      b.setAttribute("aria-label", "Color " + k); b.setAttribute("aria-pressed", String(m.color === k));
      b.addEventListener("click", () => { m.color = k; pintarEditorMomentos(); });
      gColor.appendChild(b);
    });

    card.querySelector('[data-a="subir"]').addEventListener("click", () => moverMomento(i, -1));
    card.querySelector('[data-a="bajar"]').addEventListener("click", () => moverMomento(i, 1));
    card.querySelector('[data-a="borrar"]').addEventListener("click", () => {
      if (confirm("¿Borrar el momento «" + (m.titulo || "sin título") + "»?")){ borrador.momentos.splice(i, 1); pintarEditorMomentos(); }
    });

    const grid = card.querySelector(".ed-media"), estado = card.querySelector(".ed-estado-subida");
    (m.media = m.media || []).forEach((x, k) => {
      const it = document.createElement("div");
      it.className = "ed-item";
      if (!x.src) it.innerHTML = `<div class="ed-vacio">Espacio vacío de ${x.tipo === "video" ? "video" : "foto"}</div>`;
      else if (x.tipo === "video") it.innerHTML = `<video src="${x.src}" muted playsinline preload="metadata"></video><span class="ed-tipo">${ICONOS.video}Video</span>`;
      else it.innerHTML = `<img src="${x.src}" alt="">`;
      it.insertAdjacentHTML("beforeend", `<div class="ed-acciones">
        <button data-a="izq" aria-label="Mover antes" ${k === 0 ? "hidden" : ""}>${UI.izq}</button>
        <button class="x" data-a="quitar" aria-label="Quitar">${UI.x}</button></div>`);
      it.querySelector('[data-a="izq"]').addEventListener("click", () => {
        [m.media[k-1], m.media[k]] = [m.media[k], m.media[k-1]]; pintarEditorMomentos();
      });
      it.querySelector('[data-a="quitar"]').addEventListener("click", () => { m.media.splice(k, 1); pintarEditorMomentos(); });
      grid.appendChild(it);
    });
    if (ASSETS){
      const sub = document.createElement("label");
      sub.className = "ed-subir";
      sub.innerHTML = `${UI.subir}<span>Agregar fotos o videos</span><input type="file" accept="image/*,video/*" multiple>`;
      sub.querySelector("input").addEventListener("change", e => subirA(m, [...e.target.files], estado));
      grid.appendChild(sub);
    } else {
      estado.textContent = "Subir archivos no está disponible en esta vista. Ábrela desde tu enlace de claude.ai.";
    }
    cont.appendChild(card);
  });
}
function moverMomento(i, d){
  const j = i + d;
  if (j < 0 || j >= borrador.momentos.length) return;
  [borrador.momentos[i], borrador.momentos[j]] = [borrador.momentos[j], borrador.momentos[i]];
  pintarEditorMomentos();
}

/* --- Subir fotos y videos --- */
const MAX = 20 * 1024 * 1024;
async function comprimir(file){
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const escala = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * escala), h = Math.round(bmp.height * escala);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  return await new Promise((ok, mal) => c.toBlob(b => b ? ok(b) : mal(new Error("toBlob")), "image/jpeg", .86));
}
async function subirA(m, archivos, estado){
  if (!archivos.length) return;
  subiendo++;
  let hechos = 0, fallos = [];
  for (const f of archivos){
    estado.textContent = `Subiendo ${hechos + fallos.length + 1} de ${archivos.length}…`;
    try {
      const esVideo = (f.type || "").startsWith("video/") || /\.(mov|mp4|m4v|webm)$/i.test(f.name);
      let blob = f, tipo = f.type;
      if (esVideo){
        tipo = f.type === "video/webm" ? "video/webm" : "video/mp4";
      } else if (f.type === "image/gif"){
        tipo = "image/gif";
      } else {
        try { blob = await comprimir(f); tipo = "image/jpeg"; }
        catch (e){
          if (!["image/png","image/jpeg","image/webp"].includes(f.type)) throw { code: "formato" };
        }
      }
      if (blob.size > MAX) throw { code: "too_large", mb: (blob.size / 1048576).toFixed(0) };
      const r = await ASSETS.upload(blob, { type: tipo });
      m.media.push({ tipo: esVideo ? "video" : "foto", src: "/_blob/" + r.id });
      hechos++;
    } catch (e){
      const n = f.name || "archivo";
      if (e && e.code === "too_large") fallos.push(`${n} pesa ${e.mb || "más de 20"} MB (máximo 20 MB; recórtalo un poco)`);
      else if (e && (e.code === "formato" || e.code === "unsupported_type")) fallos.push(`${n} tiene un formato que no se puede usar (prueba con JPG, PNG o MP4)`);
      else if (e && e.code === "quota_or_state") fallos.push(`${n}: ya no queda espacio para más archivos`);
      else if (e && e.code === "rate_limited") fallos.push(`${n}: demasiadas subidas seguidas, espera un momento y vuelve a intentarlo`);
      else fallos.push(`${n} no se pudo subir`);
    }
  }
  subiendo--;
  pintarEditorMomentos();
  const msg = (hechos ? `Listo: ${hechos} ${hechos === 1 ? "archivo agregado" : "archivos agregados"}. ` : "") + (fallos.length ? fallos.join(". ") + "." : "");
  avisar(msg || "Listo", fallos.length ? 6000 : 3000);
}

/* --- Guardar: publica una nueva versión de la página --- */
const CABEZA = [
  '<meta charset="UTF-8">',
  '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
  '<title>Feliz cumpleaños</title>',
  '<link rel="preconnect" href="https://fonts.googleapis.com">',
  '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
  '<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">'
].join("\n");
function construirHTML(datos){
  const cierre = "<" + "/script>";
  const json = JSON.stringify(datos, null, 2).replace(/</g, "\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n" + CABEZA + "\n<style id=\"estilos\">" + $("estilos").textContent + "</style>\n</head>\n" +
    "<body class=\"locked\">\n<template id=\"plantilla\">" + $("plantilla").innerHTML + "</template>\n" +
    "<script type=\"application/json\" id=\"datos\">\n" + json + "\n" + cierre + "\n" +
    "<script id=\"app\">" + $("app").textContent + cierre + "\n</body>\n</html>\n";
}
async function guardar(){
  if (guardando) return;
  if (subiendo){ avisar("Espera a que terminen de subirse los archivos."); return; }
  guardando = true;
  document.querySelectorAll("#ed-guardar, #pv-guardar").forEach(b => { b.disabled = true; b.lastChild.textContent = "Guardando…"; });
  try {
    const datos = JSON.parse(JSON.stringify(borrador));
    try { sessionStorage.setItem("cumple-guardado", "1"); } catch (e) {}
    await ARTIFACT.publish(construirHTML(datos));
    // la página se recarga sola con la versión nueva
  } catch (e){
    try { sessionStorage.removeItem("cumple-guardado"); } catch (x) {}
    const code = e && e.code;
    if (code === "conflict") avisar("La página se actualizó en otro lugar; se recargará con la última versión.", 5000);
    else if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "not_declared") avisar("Desde aquí no se puede guardar. Abre la página desde tu cuenta de claude.ai.", 6000);
    else if (code === "rate_limited") avisar("Guardaste muy seguido. Espera unos segundos y vuelve a intentarlo.", 5000);
    else if (code === "too_large") avisar("La página quedó demasiado grande para guardarse.", 6000);
    else avisar("No se pudo guardar. Vuelve a intentarlo en un momento.", 5000);
    document.querySelectorAll("#ed-guardar, #pv-guardar").forEach(b => { b.disabled = false; b.lastChild.textContent = "Guardar"; });
    guardando = false;
  }
}
